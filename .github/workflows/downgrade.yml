name: Downgrade
on:
  pull_request:
  push:
    branches:
      - main
    tags: '*'

# Needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Plots at its compat floor resolves to GR 0.72, whose libGRM.so needs the
    # system libxml2.so.2, which ubuntu-26.04 (ubuntu-latest) no longer ships.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum compat bounds are only checked on the oldest supported Julia:
        # several dependency floors (e.g. LLVM 9.0, Unitful 1.24) predate and
        # cannot load on newer Julia releases such as 1.13.
        version: ['1.10']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          skip: 'Dates, InteractiveUtils, JET, LinearAlgebra, Logging, Random, Test, SparseArrays, Statistics'
          mode: 'forcedeps'
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          # Nothing here uploads coverage. Instrumented runs on 1.11 were also
          # killed partway through Remapping/unit_distributed_remapping.jl, while
          # uninstrumented ones on the same commit and runner finish.
          coverage: false
        env:
          # downgrade promotes `[extras]` into `[deps]`, which makes those
          # test-only deps look stale to Aqua (see test/aqua.jl). This also
          # drops the :inference tier, whose JET counts are pinned to the
          # Manifest and drift under forced-oldest dependencies (see
          # test/runtests.jl).
          CLIMACORE_DOWNGRADE_TESTS: "true"
          # Same two-core runners as UnitTests.yml, twice over, so skip the same
          # tiers and `slow` tests.
          TEST_EXCLUDE_TIER: "conv,inference,allocs,smoke"
          TEST_EXCLUDE_SLOW: "true"
