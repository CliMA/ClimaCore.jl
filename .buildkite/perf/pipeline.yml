# A pipeline for downstream performance checks
agents:
  queue: clima
  slurm_time: 14:00:00
  modules: climacommon/2025_05_15

env:
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  GKSwstype: 100
  SLURM_KILL_BAD_EXIT: 1
  COUPLER_PATH: ".buildkite/perf/ClimaCoupler.jl"
  COUPLER_COMMIT: "1452602cf20f7806220f579044cd5683cb4910fd"
  CONFIG_PATH: "$COUPLER_PATH/config/nightly_configs"
  BENCHMARK_CONFIG_PATH: "$COUPLER_PATH/config/benchmark_configs"
  LAND_PATH: ".buildkite/perf/ClimaLand.jl"
  LAND_COMMIT: "4009df0ac2a5b62e84c5d21734926aa00338aee0"

timeout_in_minutes: 840

steps:
  - label: "init :GPU:"
    key: "init_gpu_env"
    command:
      - git clone https://github.com/CliMA/ClimaCoupler.jl.git $COUPLER_PATH && bash -c "cd $COUPLER_PATH && git checkout $COUPLER_COMMIT"
      - "echo $$JULIA_DEPOT_PATH"
      - echo "--- Instantiate AMIP env"
      # Instantiate and dev install ClimaCore
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate(;verbose=true)'
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.develop(; path = ".")'
      # Makie 0.24.16 breaks GeoMakie's precompilation (timed_ticklabelspace_reset).
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.add(; name = "Makie", version = "0.24.15")'
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.add("MPI")'
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.precompile()'
      - julia --project=$COUPLER_PATH/experiments/AMIP/ -e 'using Pkg; Pkg.status()'
    agents:
      slurm_gpus: 1
      slurm_cpus_per_task: 8
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 8
      JULIA_MAX_NUM_PRECOMPILE_FILES: 50

  - label: "TEMP: profile flagship AMIP steps (this branch vs main)"
    key: "gpu_amip_profile"
    depends_on: "init_gpu_env"
    soft_fail: true
    command:
      - echo "--- Profile with the ClimaCore of this branch"
      - "srun julia --threads=3 --color=yes --project=$COUPLER_PATH/experiments/AMIP/ .buildkite/perf/profile_amip.jl --config_file $BENCHMARK_CONFIG_PATH/amip_progedmf_1m_land_he16.yml --job_id gpu_amip_profile_pr"
      - echo "--- Set up the base ClimaCore (main, the parent of the branch head)"
      - git rev-parse HEAD~2 || git fetch --deepen=5 origin
      - git worktree add .buildkite/perf/base_core HEAD~2
      - cp -r $COUPLER_PATH/experiments/AMIP $COUPLER_PATH/experiments/AMIP_base
      - julia --project=$COUPLER_PATH/experiments/AMIP_base -e 'using Pkg; Pkg.develop(; path = ".buildkite/perf/base_core"); Pkg.precompile()'
      - echo "--- Profile with the ClimaCore of main"
      - "srun julia --threads=3 --color=yes --project=$COUPLER_PATH/experiments/AMIP_base/ .buildkite/perf/profile_amip.jl --config_file $BENCHMARK_CONFIG_PATH/amip_progedmf_1m_land_he16.yml --job_id gpu_amip_profile_base"
    env:
      CLIMACOMMS_DEVICE: "CUDA"
      JULIA_NUM_PRECOMPILE_TASKS: 8
    agents:
      slurm_gpus_per_task: 1
      slurm_cpus_per_task: 8
      slurm_ntasks: 1
      slurm_mem: 32GB
