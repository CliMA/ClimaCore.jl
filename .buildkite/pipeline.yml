agents:
  queue: central
  slurm_mem: 8G
  modules: climacommon/2024_10_10

env:
  JULIA_LOAD_PATH: "${JULIA_LOAD_PATH}:${BUILDKITE_BUILD_CHECKOUT_PATH}/.buildkite"
  # Written only by init, `.buildkite/hooks/pre-command` puts a node-local
  # depot ahead of it for every other step.
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  JULIA_CPU_TARGET: 'broadwell;skylake'
  JULIA_NVTX_CALLBACKS: gc
  OPENBLAS_NUM_THREADS: 1

steps:
  - label: "initialize"
    key: "init_cpu_env"
    command:
      - echo "--- Check that ClimaCore is developed in Manifest"
      - julia --check-bounds=yes -e 'using TOML; @assert TOML.parsefile(".buildkite/Manifest.toml")["deps"]["ClimaCore"][1]["path"] == ".."'

      - echo "--- Instantiate buildkite env"
      - "julia --project=.buildkite --check-bounds=yes -e 'using Pkg; Pkg.instantiate(;verbose=true); Pkg.precompile(;strict=true); Pkg.status()'"
      # Precompile caches are keyed by the bounds-check flag; also warm the
      # default-bounds cache used by the curated :inference/:allocs tier jobs.
      - "julia --project=.buildkite -e 'using Pkg; Pkg.precompile(;strict=true)'"
      - "julia --project=.buildkite -e 'using CUDA; CUDA.precompile_runtime()'"

    agents:
      slurm_mem: 80G
      slurm_gpus: 1
      slurm_cpus_per_task: 12
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 12

  - wait

  - label: "DEBUG Unit (GPU) - fields"
    key: debug_gpu_fields
    command:
      - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
      - "julia --color=yes --project=.buildkite test/runtests.jl"
    timeout_in_minutes: 60
    env:
      CLIMACOMMS_DEVICE: "CUDA"
      TEST_SUBSYSTEM: "fields"
      TEST_EXCLUDE_TIER: "conv,inference,allocs,gpu,smoke"
      TEST_EXCLUDE_TAG: "operators/integrals.jl"
    agents:
      slurm_gpus: 1
      slurm_mem: 20G
