agents:
  queue: central
  slurm_mem: 8G
  modules: climacommon/2026_10_30-1.13.3

env:
  JULIA_LOAD_PATH: "${JULIA_LOAD_PATH}:${BUILDKITE_BUILD_CHECKOUT_PATH}/.buildkite"
  # Written only by init, `.buildkite/hooks/pre-command` puts a node-local
  # depot ahead of it for every other step.
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  JULIA_CPU_TARGET: 'broadwell;skylake'
  JULIA_NVTX_CALLBACKS: gc
  OPENBLAS_NUM_THREADS: 1

steps:
  # Bisect branch: one init step and one test. Past init steps took 5-8 minutes
  # with a warm depot, and the whole edge-case file 7-10 minutes on the P100.
  - label: "initialize"
    key: "init_cpu_env"
    command:
      - echo "--- Check that ClimaCore is developed in Manifest"
      - julia --check-bounds=yes -e 'using TOML; @assert TOML.parsefile(".buildkite/Manifest.toml")["deps"]["ClimaCore"][1]["path"] == ".."'

      - echo "--- Instantiate buildkite env"
      - "julia --project=.buildkite --check-bounds=yes -e 'using Pkg; Pkg.instantiate(;verbose=true); Pkg.precompile(;strict=true); Pkg.status()'"
      - "julia --project=.buildkite --check-bounds=yes -e 'using CUDA; CUDA.precompile_runtime()'"

    agents:
      slurm_mem: 80G
      slurm_gpus: 1
      slurm_cpus_per_task: 12
      slurm_time: 00:30:00
    timeout_in_minutes: 30
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 12

  - wait

  - label: "Bisect (GPU) - tuple flux, device vs CPU"
    key: bisect_tuple_flux
    command:
      - "julia --project=.buildkite --check-bounds=yes -e 'using CUDA; CUDA.versioninfo()'"
      - "julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/bisect_tuple_flux.jl"
    env:
      CLIMACOMMS_DEVICE: "CUDA"
    agents:
      slurm_gpus: 1
      slurm_mem: 20G
      slurm_time: 00:20:00
    timeout_in_minutes: 20
