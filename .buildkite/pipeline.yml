agents:
  queue: central
  slurm_mem: 8G
  modules: climacommon/2024_10_10

env:
  JULIA_LOAD_PATH: "${JULIA_LOAD_PATH}:${BUILDKITE_BUILD_CHECKOUT_PATH}/.buildkite"
  JULIA_DEPOT_PATH: "${BUILDKITE_BUILD_PATH}/${BUILDKITE_PIPELINE_SLUG}/depot/default"
  JULIA_MAX_NUM_PRECOMPILE_FILES: 100
  JULIA_CPU_TARGET: 'broadwell;skylake'
  JULIA_NVTX_CALLBACKS: gc
  OPENBLAS_NUM_THREADS: 1

steps:
  - label: "initialize"
    key: "init_cpu_env"
    command:
      - echo "--- Check that ClimaCore is developed in Manifest"
      - julia --check-bounds=yes -e 'using TOML; @assert TOML.parsefile(".buildkite/Manifest.toml")["deps"]["ClimaCore"][1]["path"] == ".."'

      - echo "--- Instantiate buildkite env"
      - "julia --project=.buildkite --check-bounds=yes -e 'using Pkg; Pkg.instantiate(;verbose=true); Pkg.precompile(;strict=true); Pkg.status()'"
      # Precompile caches are keyed by the bounds-check flag; also warm the
      # default-bounds cache used by the curated :opt/:allocs tier jobs.
      - "julia --project=.buildkite -e 'using Pkg; Pkg.precompile(;strict=true)'"
      - "julia --project=.buildkite -e 'using CUDA; CUDA.precompile_runtime()'"

    agents:
      slurm_mem: 80G
      slurm_gpus: 1
      slurm_cpus_per_task: 12
    env:
      JULIA_NUM_PRECOMPILE_TASKS: 12

  - wait

  # The curated harness `test/runtests.jl` is the single source of truth for
  # the test suite. The CPU groups below run it end-to-end:
  #  - one job per subsystem for the fast tiers (:unit/:inference/:smoke/:misc),
  #    sharded via TEST_SUBSYSTEM, run under default bounds checking because the
  #    :unit tier embeds zero-allocation assertions that only hold under the
  #    production `--check-bounds` setting (forcing `--check-bounds=yes` disables
  #    @inbounds elision and adds spurious allocations);
  #  - a dedicated bounds-checked job for the :conv tier (pure numerics with no
  #    allocation gates, so `--check-bounds=yes` adds out-of-bounds safety);
  #  - dedicated default-bounds jobs for the :opt (JET, whose optimized-IR
  #    checks depend on the bounds-check flag) and :allocs (production-flag
  #    allocation gates) tiers.
  # GPU-only tests are filtered out on CPU agents and covered by the GPU group;
  # MPI/multi-GPU tests (meta = :distributed) are filtered out on single-rank
  # runs and driven by the srun steps below.
  - group: "Unit: curated suite (CPU)"
    steps:
      - label: "Unit: curated suite - {{matrix.subsystem}}"
        key: unit_curated_suite_cpu
        retry: &retry_policy
          automatic:
            - exit_status: -1  # Retry on agent lost
              limit: 1
        matrix:
          setup:
            subsystem:
              - "datalayouts"
              - "utilities"
              - "geometry"
              - "domains"
              - "meshes"
              - "topologies"
              - "quadratures"
              - "spaces"
              - "fields"
              - "operators"
              - "matrixfields"
              - "hypsography"
              - "limiters"
              - "io"
              - "remapping"
              - "integration"
              - "quality"
        command: "julia --color=yes --project=.buildkite test/runtests.jl"
        env:
          TEST_SUBSYSTEM: "{{matrix.subsystem}}"
          TEST_EXCLUDE_TIER: "conv,opt,allocs"
        agents:
          slurm_mem: 20G

      - label: "Unit: curated suite - convergence tier"
        key: unit_curated_suite_conv
        retry: *retry_policy
        command: "julia --color=yes --check-bounds=yes --project=.buildkite test/runtests.jl"
        env:
          TEST_TIER: "conv"
        agents:
          slurm_mem: 20G

      - label: "Unit: curated suite - opt tier"
        key: unit_curated_suite_opt
        retry: *retry_policy
        # Default bounds: the :opt tier's JET @test_opt checks inspect the
        # optimized IR, which changes under --check-bounds=yes.
        command: "julia --color=yes --project=.buildkite test/runtests.jl"
        env:
          TEST_TIER: "opt"
        agents:
          slurm_mem: 20G

      - label: "Unit: curated suite - allocs tier"
        key: unit_curated_suite_allocs
        retry: *retry_policy
        # Default bounds: allocation gates run with production flags.
        command: "julia --color=yes --project=.buildkite test/runtests.jl"
        env:
          TEST_TIER: "allocs"
        agents:
          slurm_mem: 20G

  # GPU counterpart of the curated-suite group. The subsystem matrix runs the
  # same fast-tier tests as the CPU matrix on a GPU agent (the harness drops
  # `meta = :cpu_only` tests when a CUDA device is active), and the two tier
  # steps below cover the GPU-only and end-to-end tiers. `:integration` is
  # absent from the matrix because all of its tests are `:smoke`-tier, which
  # its own step runs. Multi-GPU / MPI (srun) steps are not harness-runnable
  # and remain further below.
  - group: "Unit: curated suite (GPU)"
    steps:
      - label: "Unit: curated suite (GPU) - {{matrix.subsystem}}"
        key: unit_curated_suite_gpu_matrix
        retry: *retry_policy
        matrix:
          setup:
            subsystem:
              - "datalayouts"
              - "utilities"
              - "geometry"
              - "domains"
              - "meshes"
              - "topologies"
              - "quadratures"
              - "spaces"
              - "fields"
              - "operators"
              - "matrixfields"
              - "hypsography"
              - "limiters"
              - "io"
              - "remapping"
              - "quality"
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --project=.buildkite test/runtests.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          TEST_SUBSYSTEM: "{{matrix.subsystem}}"
          TEST_EXCLUDE_TIER: "conv,opt,allocs,gpu,smoke"
        agents:
          slurm_gpus: 1
          slurm_mem: 20G

      - label: "Unit: curated suite (GPU) - :gpu tier"
        key: unit_curated_suite_gpu
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --check-bounds=yes --project=.buildkite test/runtests.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          TEST_TIER: "gpu"
        agents:
          slurm_gpus: 1
          slurm_mem: 20G

      # The :opt tier is JET analysis, which is compile-time work rather than
      # GPU work, but `Spaces/opt_spaces.jl` and
      # `Operators/finitedifference/opt_examples.jl` carry separately
      # calibrated CUDA branches that only this step executes.
      - label: "Unit: curated suite (GPU) - :opt tier"
        key: unit_curated_suite_gpu_opt
        retry: *retry_policy
        # Default bounds: the :opt tier's JET @test_opt checks inspect the
        # optimized IR, which changes under --check-bounds=yes.
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --project=.buildkite test/runtests.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          TEST_TIER: "opt"
        agents:
          slurm_gpus: 1
          slurm_mem: 20G

      - label: "Unit: curated suite (GPU) - :smoke tier"
        key: unit_curated_suite_gpu_smoke
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --check-bounds=yes --project=.buildkite test/runtests.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          TEST_TIER: "smoke"
        agents:
          slurm_gpus: 1
          slurm_mem: 20G

  - group: "Unit: Multithreaded & Special Ops"
    steps:
      - label: "Unit: data fill and copyto (4 threads)"
        key: threaded_unit_data_fill_and_copyto
        retry: *retry_policy
        command: "julia --threads=4 --color=yes --check-bounds=yes --project=.buildkite test/DataLayouts/unit_fill_and_copyto.jl"

      - label: "Unit: data loops (4 threads)"
        key: threaded_unit_data_loops
        retry: *retry_policy
        command: "julia --threads=4 --color=yes --check-bounds=yes --project=.buildkite test/DataLayouts/unit_loops.jl"

      - label: "Unit: mapreduce (4 threads)"
        key: threaded_unit_data_mapreduce
        retry: *retry_policy
        command: "julia --threads=4 --color=yes --check-bounds=yes --project=.buildkite test/DataLayouts/unit_mapreduce.jl"

      - label: "Unit: advection operator convergence"
        key: unit_adv_conv
        retry: *retry_policy
        command: "julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/finitedifference/conv_advection_diffusion1d.jl"

      - label: "Unit: hyb ops simulation 3d"
        key: unit_hyb_ops_3d
        retry: *retry_policy
        command:
          - "julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/hybrid/simulation_3d.jl"

      # GPU twin of the step above. This file needs OrdinaryDiffEqSSPRK, which
      # is not a test-target dependency, so it cannot run through the harness.
      # Note that only the second of its three testsets picks up
      # `ClimaComms.device()`; the other two build their spaces with an
      # explicit `CPUSingleThreaded` device and so stay on the CPU here.
      - label: "Unit: hyb ops simulation 3d (GPU)"
        key: unit_hyb_ops_3d_gpu
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/hybrid/simulation_3d.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus: 1

  - group: "Unit: Distributed (CPU & GPU MPI)"
    steps:
      - label: "Unit: data mapreduce (2 gpus)"
        key: gpu_2_unit_data_mapreduce
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/DataLayouts/unit_mapreduce.jl"
        env:
           CLIMACOMMS_DEVICE: "CUDA"
           CLIMACOMMS_CONTEXT: "MPI"
        agents:
           slurm_ntasks: 2
           slurm_gpus: 2
           modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: topologies distributed"
        key: unit_topologies_distributed
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Topologies/dtopo4.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 4
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: common spaces with CUDA and MPI"
        key: "gpu_common_cuda_mpi_spaces"
        retry: *retry_policy
        command:
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/CommonSpaces/unit_common_spaces.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus: 1
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: common spaces with MPI"
        key: "common_cuda_mpi_spaces"
        retry: *retry_policy
        command:
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/CommonSpaces/unit_common_spaces.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed cuda spaces"
        key: "gpu_distributed_extruded_cuda_spaces"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/space_construction.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_gpus_per_task: 1
          slurm_ntasks: 3
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed dss2"
        key: unit_distributed_dss2
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed/ddss2.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed dss3"
        key: unit_distributed_dss3
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed/ddss3.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 3
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed dss4"
        key: unit_distributed_dss4
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed/ddss4.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 4
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed remapping (2 processes)"
        key: distributed_remapping_2procs
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Remapping/unit_distributed_remapping.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CPU"
        agents:
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed remapping with CUDA (2 processes)"
        key: distributed_remapping_gpu_2procs
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Remapping/unit_distributed_remapping.jl"
        soft_fail: true
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 2
          slurm_gpus_per_task: 1

      - label: "Unit: distributed gather"
        key: unit_distributed_gather4
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed/gather4.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 4
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda dss 2-process test"
        key: "gpu_ddss2_test"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss2.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 2
          slurm_gpus: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda dss 3-process test"
        key: "gpu_ddss3_test"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss3.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 3
          slurm_gpus: 3
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda dss 4-process test"
        key: "gpu_ddss4_test"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss4.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 4
          slurm_gpus: 4
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda Cubed Sphere dss; ne = 32; 2-process test"
        key: "gpu_ddss_ne32_cs_2processes"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss_ne32_cs.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 2
          slurm_gpus: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda Cubed Sphere dss; ne = 32; 3-process test"
        key: "gpu_ddss_ne32_cs_3processes"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss_ne32_cs.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 3
          slurm_gpus: 3
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: cuda Cubed Sphere dss; ne = 32; 4-process test"
        key: "gpu_ddss_ne32_cs_4processes"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Spaces/distributed_cuda/ddss_ne32_cs.jl"
        timeout_in_minutes: 15
        env:
          CLIMACOMMS_CONTEXT: "MPI"
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_ntasks: 4
          slurm_gpus: 4
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed reduction cuda"
        key: unit_distributed_reduction_cuda
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Fields/gpu_reduction_distributed.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_gpus_per_task: 1
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: run sphere geometry distributed (2)"
        key: unit_run_sphere_geometry_distributed2
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/spectralelement/sphere_geometry_distributed.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 2
          slurm_mem: 20GB

      - label: "Unit: run sphere geometry distributed (3)"
        key: unit_run_sphere_geometry_distributed3
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/spectralelement/sphere_geometry_distributed.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 3
          slurm_mem: 20GB
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: run sphere geometry distributed (4)"
        key: unit_run_sphere_geometry_distributed4
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Operators/spectralelement/sphere_geometry_distributed.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 4
          slurm_mem: 20GB
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: Parallel HDF5 IO tests"
        key: "cpu_parallel_hdf5"
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/InputOutput/unit_hybrid3dcubedsphere.jl"
        timeout_in_minutes: 5
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        retry:
          automatic: true
        agents:
          slurm_nodes: 3
          slurm_tasks_per_node: 1
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

      - label: "Unit: distributed limiters"
        key: unit_limiters_distributed
        retry: *retry_policy
        command: "srun julia --color=yes --check-bounds=yes --project=.buildkite test/Limiters/distributed/dlimiter.jl"
        env:
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 3
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10

  # TODO: improve performance label: [inference, allocs, flops, latency, benchmark, boundscheck]
  # TODO: use perf env for perf jobs, or merge test/perf envs
  - group: "Perf: DataLayouts"
    steps:

      - label: "Perf: DataLayouts fill"
        key: "cpu_datalayouts_fill"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_fill.jl"

      - label: "Perf: DataLayouts copyto"
        key: "cpu_datalayouts_copyto"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_copyto.jl"

      - label: "Perf: DataLayouts loops"
        key: "cpu_datalayouts_loops"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_loops.jl"

      - label: "Perf: DataLayouts fill (gpu)"
        key: "gpu_datalayouts_fill"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_fill.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus: 1

      - label: "Perf: DataLayouts copyto (gpu)"
        key: "gpu_datalayouts_copyto"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_copyto.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus: 1

      - label: "Perf: DataLayouts loops (gpu)"
        key: "gpu_datalayouts_loops"
        retry: *retry_policy
        command:
          - "julia --project=.buildkite -e 'using CUDA; CUDA.versioninfo()'"
          - "julia --color=yes --project=.buildkite test/DataLayouts/benchmark_loops.jl"
        env:
          CLIMACOMMS_DEVICE: "CUDA"
        agents:
          slurm_gpus: 1

  - group: "Perf: Fields"
    steps:

