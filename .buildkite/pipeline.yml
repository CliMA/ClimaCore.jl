        env:
          TEST_NAME: "sphere/baroclinic_wave_rhoe"
          CLIMACOMMS_CONTEXT: "MPI"
        agents:
          slurm_ntasks: 2
          modules: mpiwrapper/2024_05_27 climacommon/2024_10_10


      - label: ":computer: 3D sphere nonhydrostatic gravity wave"
        key: "cpu_nonhydrostatic_gravity_wave"
        retry: *retry_policy
        command:
          - "julia --color=yes --project=.buildkite examples/hybrid/sphere/nonhydrostatic_gravity_wave.jl"
        artifact_paths:
          - "examples/hybrid/sphere/output/nonhydrostatic_gravity_wave/*"

      - label: ":computer: 3D sphere solid-body rotation"
        key: "cpu_solid_body_rotation"
        retry: *retry_policy
        command:
          - "julia --color=yes --project=.buildkite examples/hybrid/sphere/solid_body_rotation_3d.jl"

      - label: ":computer: 3D sphere hydrostatically and geostrophically balanced flow (ρe)"
        key: "cpu_balanced_flow_rho_e"
        retry: *retry_policy
        command:
          - "julia --color=yes --project=.buildkite examples/hybrid/driver.jl"
        artifact_paths:
          - "examples/hybrid/sphere/output/balanced_flow_rhoe/Float32/*"
        env:
          TEST_NAME: "sphere/balanced_flow_rhoe"

  - group: "Examples: hybrid plane"
    steps:

      - label: ":computer: 2D plane inertial gravity wave"
        key: "cpu_inertial_gravity_wave"
        retry: *retry_policy
        command:
          - "julia --threads 8 --color=yes --project=.buildkite examples/hybrid/driver.jl"
        artifact_paths:
          - "examples/hybrid/plane/output/inertial_gravity_wave/Float32/*"
        env:
          TEST_NAME: "plane/inertial_gravity_wave"
        agents:
          slurm_cpus_per_task: 8
          slurm_mem: 20GB

      - label: ":computer: stretched 2D plane inertial gravity wave"
        key: "cpu_stretch_inertial_gravity_wave"
        retry: *retry_policy
        command:
          - "julia --threads 8 --color=yes --project=.buildkite examples/hybrid/driver.jl"
        artifact_paths:
          - "examples/hybrid/plane/output/stretched_inertial_gravity_wave/Float32/*"
        env:
          TEST_NAME: "plane/inertial_gravity_wave"
          Z_STRETCH: "true"
        agents:
          slurm_cpus_per_task: 8
          slurm_mem: 20GB

  - group: "Analysis"
    steps:

      - label: "Analysis: Flamegraph profile"
        key: "cpu_flamegraph"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite perf/flame.jl"
        artifact_paths:
          - "perf/output/*"

      - label: "Analysis: Benchmark step!"
        key: "cpu_benchmark"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite perf/benchmark.jl"

      - label: "Analysis: Invalidations"
        key: "cpu_invalidations"
        retry: *retry_policy
        command: "julia --color=yes --project=.buildkite perf/invalidations.jl"
  - group: "Downstream tests"
    steps:
      # Downstream test: run ClimaAtmos CI against this ClimaCore commit.
      # ClimaAtmos's pipeline sees UPSTREAM_PACKAGES and
      # Pkg.adds each `Package#rev` entry at that rev (see ClimaAtmos.jl's
      # .buildkite/full_pipeline.yml "Downstream test hook"). ClimaCoreSpectra and
      # ClimaCoreTempestRemap are used in ClimaAtmos CI. They live in this repo's lib/, so
      # pin them to the same commit to keep the family mutually consistent.
      - label: ":rocket: Downstream: trigger ClimaAtmos CI"
        # Deliberately NOT climaatmos-ci: downstream builds run on atmos `main`,
        # and building them under the same pipeline would pollute climaatmos-ci's
        # main-branch status badge and build history. climaatmos-downstream uses the same
        # comfig (pipeline.yml) that climaatmos-ci, but lives in a separate pipeline.
        trigger: "climaatmos-downstream"
        build:
          branch: "main"
          message: "Downstream test: ClimaCore ${BUILDKITE_BRANCH} @ ${BUILDKITE_COMMIT:0:8}"
          env:
            UPSTREAM_PACKAGES: "ClimaCore#${BUILDKITE_COMMIT} ClimaCoreSpectra#${BUILDKITE_COMMIT} ClimaCoreTempestRemap#${BUILDKITE_COMMIT}"
        soft_fail: true # downstream test failures don't block a merge

  - wait

  - label: ":chart_with_downwards_trend: build history"
    retry: *retry_policy
    command:
      - "build_history staging"
    artifact_paths:
      - "build_history.html"
